name: Supabase Keepalive

on:
  schedule:
    # 每天 UTC 时间 0:00 和 12:00 执行（北京时间 8:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许手动触发

# 允许工作流往仓库提交活动记录，防止公开仓库 60 天无活动被自动停用
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'
          
      - name: Log result
        run: echo "Keepalive ping sent at $(date)"

      - name: Checkout for activity ping
        uses: actions/checkout@v4

      - name: Monthly activity commit
        run: |
          FILE=last-activity.txt
          TODAY=$(date -u +%Y-%m-%d)
          LAST=$(cat "$FILE" 2>/dev/null || echo "1970-01-01")
          DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "Last activity commit: $LAST ($DAYS days ago)"
          if [ "$DAYS" -ge 30 ]; then
            echo "$TODAY" > "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore: monthly activity ping ($TODAY)"
            git push
            echo "Activity commit pushed."
          else
            echo "No activity commit needed yet."
          fi
